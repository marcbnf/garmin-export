# Tool configuration only: the app is built with build.py (PyInstaller),
# not installed as a package.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are fine (log messages, descriptions)

[tool.ruff.lint.isort]
known-first-party = ["garmin_export"]

[tool.mypy]
python_version = "3.10"
files = ["main.py", "build.py", "garmin_export"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
